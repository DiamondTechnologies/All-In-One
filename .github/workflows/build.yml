name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild "All In One.csproj" /t:Restore /p:Configuration=Release

      - name: Build
        run: >
          msbuild "All In One.csproj"
          /p:Configuration=Release
          /p:AppxPackageSigningEnabled=false